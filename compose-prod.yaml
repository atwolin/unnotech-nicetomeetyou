services:
  db:
    image: postgres:16.13-alpine
    container_name: udnnews_db
    restart: unless-stopped
    shm_size: 128mb
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - udnnews
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: udnnews_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - udnnews
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: udnnews_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_static:/app/staticfiles
    env_file:
      - .env
    networks:
      - udnnews
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 8000), timeout=5).close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: udnnews_celery_worker
    restart: unless-stopped
    command: >
      uv run celery -A config worker
      --loglevel=info
      --concurrency=1
    volumes:
      - backend_static:/app/staticfiles
    env_file:
      - .env
    environment:
      - SKIP_COLLECTSTATIC=true
    networks:
      - udnnews
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: udnnews_celery_beat
    restart: unless-stopped
    command: >
      uv run celery -A config beat
      --loglevel=info
      --schedule /tmp/celerybeat-schedule
    volumes:
      - backend_static:/app/staticfiles
    env_file:
      - .env
    environment:
      - SKIP_COLLECTSTATIC=true
    networks:
      - udnnews
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: udnnews_frontend
    restart: unless-stopped
    # Only accessible from host (VM's Nginx will proxy here)
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - udnnews
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  udnnews:
    driver: bridge

volumes:
  db_data:
  redis_data:
  backend_static:
