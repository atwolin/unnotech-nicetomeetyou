<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 找不到網頁 - UDN News</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'udn-blue': '#005b9f',
                        'udn-red': '#cc0000',
                        'udn-yellow': '#ffcc00',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div
        class="text-center px-6 py-12 bg-white rounded-3xl shadow-xl max-w-lg w-full transform transition-all hover:scale-105 duration-500">
        <div class="flex justify-center mb-6">
            <svg class="h-24 w-24 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <h1 class="text-9xl font-black text-udn-blue mb-4 tracking-tighter shadow-sm">404</h1>
        <h2 class="text-2xl font-bold text-gray-800 mb-4">找不到您要的網頁</h2>
        <p class="text-gray-500 mb-8 max-w-md mx-auto">
            很抱歉，我們找不到您所請求的頁面。它可能已被移除、重新命名，或者暫時無法使用。
        </p>
        <a href="/"
            class="inline-flex items-center justify-center px-8 py-4 border border-transparent text-base font-bold rounded-full text-white bg-gradient-to-r from-udn-blue to-blue-600 hover:from-blue-600 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-udn-blue shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 w-full sm:w-auto">
            返回首頁
            <svg class="ml-2 -mr-1 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
                </path>
            </svg>
        </a>
    </div>
</body>

</html>
