<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>udn NBA 焦點新聞 | UDN News Focus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        udn: {
                            blue: '#004de6',
                            yellow: '#ffaa00',
                            orange: '#ff6600',
                            red: '#ff0000',
                            gray: '#f9fafb',
                            dark: '#111827'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-udn-gray text-udn-dark font-sans antialiased" x-data="newsApp()">

    <!-- Header -->
    <header
        class="bg-white/80 backdrop-blur-md shadow-sm border-t-4 border-udn-blue sticky top-0 z-40 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo area -->
                <div class="flex items-center space-x-2 cursor-pointer transition-transform hover:scale-105"
                    @click="fetchArticles()">
                    <div class="flex items-center -space-x-2 font-black italic tracking-tighter">
                        <span class="text-3xl text-udn-blue drop-shadow-sm mr-2">udn</span>
                        <span class="text-3xl text-udn-red drop-shadow-sm">NBA</span>
                    </div>
                    <span
                        class="text-xl font-bold ml-4 text-gray-800 border-l-2 pl-3 py-1 border-gray-200">焦點新聞資料庫</span>
                </div>
                <!-- Controls -->
                <div>
                    <button @click="fetchArticles()"
                        class="p-2.5 rounded-full bg-white border border-gray-100 hover:shadow-md hover:border-udn-orange transition-all duration-300 focus:outline-none group tooltip"
                        title="重新整理">
                        <svg class="w-5 h-5 text-udn-orange transform group-hover:rotate-180 transition-transform duration-500"
                            :class="{'animate-spin': isLoading}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 min-h-screen">

        <!-- Animated Loader -->
        <div x-show="isLoading && articles.length === 0"
            class="flex flex-col justify-center items-center py-32 space-y-4 text-udn-blue">
            <div class="relative w-16 h-16">
                <div class="absolute inset-0 border-4 border-udn-blue/30 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-udn-blue rounded-full border-t-transparent animate-spin">
                </div>
            </div>
            <p class="font-medium animate-pulse">正在載入最新焦點...</p>
        </div>

        <!-- Error State -->
        <div x-show="error"
            class="bg-red-50 border-l-4 border-udn-red p-4 my-4 rounded shadow-sm flex items-center justify-between"
            x-transition x-cloak>
            <div class="flex items-center">
                <svg class="h-6 w-6 text-udn-red mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p class="text-red-800 font-medium" x-text="error"></p>
            </div>
            <button @click="fetchArticles()"
                class="text-sm font-bold text-red-600 hover:text-red-800 underline">重試</button>
        </div>

        <!-- Empty State -->
        <div x-show="!isLoading && articles.length === 0 && !error"
            class="flex flex-col items-center justify-center py-32" x-cloak>
            <div class="w-24 h-24 mb-6 rounded-full bg-gray-100 flex items-center justify-center">
                <svg class="h-10 w-10 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-8-3h4" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900">目前沒有新聞</h3>
            <p class="mt-2 text-gray-500">稍後再來查看最新的焦點資訊吧！</p>
        </div>

        <!-- News Masonry / Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 lg:gap-8"
            x-show="articles.length > 0" x-transition>
            <template x-for="(article, index) in articles" :key="article.id">
                <article
                    class="bg-white rounded-2xl shadow-sm hover:shadow-2xl transition-all duration-500 transform hover:-translate-y-1.5 overflow-hidden cursor-pointer flex flex-col h-full border border-gray-100/80 group"
                    @click="openModal(article)" :style="`animation-delay: ${index * 50}ms;`">

                    <div class="relative h-56 w-full overflow-hidden bg-gray-50">
                        <img :src="article.image_url || 'https://via.placeholder.com/600x400?text=No+Image'"
                            :alt="article.title"
                            class="w-full h-full object-cover group-hover:scale-110 group-hover:rotate-1 transition-transform duration-700 ease-out"
                            @error="if (!$el.dataset.retried && article.image_url) { $el.dataset.retried = 'true'; $el.src = 'https://pgw.udn.com.tw/gw/photo.php?u=' + encodeURIComponent(article.image_url); } else { $el.style.display = 'none'; }">

                        <div
                            class="absolute inset-0 bg-gradient-to-t from-gray-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        </div>

                        <div
                            class="absolute top-4 right-4 px-3 py-1.5 bg-udn-blue/90 backdrop-blur text-white text-xs font-bold rounded-lg shadow-lg uppercase tracking-wider transform translate-x-4 opacity-0 group-hover:translate-x-0 group-hover:opacity-100 transition-all duration-300">
                            閱讀更多
                        </div>
                    </div>

                    <div class="p-6 flex flex-col flex-grow relative">
                        <div class="flex items-center justify-end mb-3">
                            <span class="text-xs text-gray-400 flex items-center font-medium">
                                <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                <span x-text="formatDate(article.published_at)"></span>
                            </span>
                        </div>
                        <h2 class="text-xl font-bold text-gray-900 mb-3 line-clamp-2 leading-snug group-hover:text-udn-blue transition-colors duration-200"
                            x-text="article.title"></h2>
                        <p class="text-sm text-gray-500 line-clamp-3 mb-4 flex-grow leading-relaxed"
                            x-text="article.summary || article.content.substring(0, 100) + '...'"></p>

                        <!-- Tags moved to bottom to prevent alignment issues -->
                        <div class="flex flex-wrap gap-1.5 mt-auto pt-2 border-t border-gray-50">
                            <template x-for="kw in getKeywords(article.keywords)" :key="kw">
                                <span
                                    class="text-xs font-bold text-udn-red bg-red-50 px-2 py-1 rounded-md tracking-widest uppercase border border-red-100"
                                    x-text="kw"></span>
                            </template>
                        </div>
                    </div>
                </article>
            </template>
        </div>

        <!-- Pagination Controls -->
        <div class="mt-12 flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6 rounded-2xl shadow-sm"
            x-show="totalPages > 1" x-cloak>
            <div class="flex flex-1 justify-between sm:hidden">
                <button @click="goToPage(previousUrl)" :disabled="!previousUrl"
                    class="relative inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    上一頁
                </button>
                <button @click="goToPage(nextUrl)" :disabled="!nextUrl"
                    class="relative ml-3 inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    下一頁
                </button>
            </div>
            <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
                <div>
                    <p class="text-sm text-gray-700">
                        總共 <span class="font-medium" x-text="totalCount"></span> 筆新聞，第 <span class="font-medium"
                            x-text="currentPage"></span> / <span class="font-medium" x-text="totalPages"></span> 頁
                    </p>
                </div>
                <div>
                    <nav class="isolate inline-flex -space-x-px rounded-md shadow-sm" aria-label="Pagination">
                        <!-- Previous Button -->
                        <button @click="goToPage(previousUrl)" :disabled="!previousUrl"
                            class="relative inline-flex items-center rounded-l-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            <span class="sr-only">Previous</span>
                            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd"
                                    d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z"
                                    clip-rule="evenodd" />
                            </svg>
                        </button>

                        <!-- Page Numbers (Simplified, just showing current page for now to avoid complex sliding window logic in alpine) -->
                        <span
                            class="relative inline-flex items-center px-4 py-2 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-300 focus:outline-offset-0">
                            第 <span x-text="currentPage" class="mx-1"></span> 頁
                        </span>

                        <!-- Next Button -->
                        <button @click="goToPage(nextUrl)" :disabled="!nextUrl"
                            class="relative inline-flex items-center rounded-r-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            <span class="sr-only">Next</span>
                            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd"
                                    d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
                                    clip-rule="evenodd" />
                            </svg>
                        </button>
                    </nav>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Overlay -->
    <div x-show="isModalOpen" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog"
        aria-modal="true" x-cloak>
        <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:p-0">
            <!-- Background overlay -->
            <div x-show="isModalOpen" x-transition:enter="ease-out duration-300"
                x-transition:enter-start="opacity-0 backdrop-blur-none"
                x-transition:enter-end="opacity-100 backdrop-blur-md" x-transition:leave="ease-in duration-200"
                x-transition:leave-start="opacity-100 backdrop-blur-md"
                x-transition:leave-end="opacity-0 backdrop-blur-none"
                class="fixed inset-0 bg-gray-900/60 transition-all" @click="closeModal()" aria-hidden="true"></div>

            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <!-- Modal panel -->
            <div x-show="isModalOpen" x-transition:enter="ease-out duration-400"
                x-transition:enter-start="opacity-0 translate-y-8 sm:translate-y-0 sm:scale-90"
                x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
                x-transition:leave="ease-in duration-200"
                x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
                x-transition:leave-end="opacity-0 translate-y-8 sm:translate-y-0 sm:scale-95"
                class="inline-block align-bottom bg-white rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full relative">

                <!-- Loading State inside Modal -->
                <div x-show="isLoadingDetail"
                    class="absolute inset-0 bg-white/90 z-10 flex flex-col items-center justify-center backdrop-blur-sm">
                    <div class="relative w-12 h-12 mb-4">
                        <div class="absolute inset-0 border-4 border-udn-yellow/30 rounded-full"></div>
                        <div
                            class="absolute inset-0 border-4 border-udn-yellow rounded-full border-t-transparent animate-spin">
                        </div>
                    </div>
                    <p class="text-sm font-medium text-udn-yellow animate-pulse">載入完整內容...</p>
                </div>

                <template x-if="selectedArticle">
                    <div class="bg-white flex flex-col max-h-[90vh]">
                        <!-- Close button -->
                        <div class="absolute top-4 right-4 z-30">
                            <button @click="closeModal()" type="button"
                                class="bg-black/20 backdrop-blur-md rounded-full p-2 text-white hover:bg-black/40 hover:scale-110 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-transparent focus:ring-white transition-all shadow-lg">
                                <span class="sr-only">關閉</span>
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                        d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>

                        <!-- Text Header -->
                        <div class="px-8 pt-10 pb-6 border-b border-gray-100 flex-shrink-0 relative">
                            <div class="flex flex-wrap items-center gap-2 mb-4">
                                <template x-for="kw in getKeywords(selectedArticle.keywords)" :key="kw">
                                    <span
                                        class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-udn-blue/10 text-udn-blue tracking-wider"
                                        x-text="kw"></span>
                                </template>
                            </div>
                            <h3 class="text-3xl sm:text-4xl font-black text-gray-900 leading-tight mb-4"
                                id="modal-title" x-text="selectedArticle.title"></h3>
                            <div class="flex items-center text-sm font-medium text-gray-500 space-x-6">
                                <div class="flex items-center">
                                    <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                                        </path>
                                    </svg>
                                    <span x-text="formatDate(selectedArticle.published_at)"></span>
                                </div>
                                <template x-if="selectedArticle.author">
                                    <div class="flex items-center">
                                        <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z">
                                            </path>
                                        </svg>
                                        <span x-text="selectedArticle.author"></span>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Content Body -->
                        <div class="px-8 py-8 overflow-y-auto flex-grow" style="scrollbar-width: thin;">
                            <div class="prose prose-lg prose-blue max-w-3xl mx-auto text-gray-700 leading-loose custom-content"
                                x-html="formatContent(selectedArticle.body)"></div>

                            <!-- Crawler Metadata Section -->
                            <div class="mt-12 pt-8 border-t border-gray-100 max-w-3xl mx-auto">
                                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">爬蟲資料標籤</h4>
                                <div
                                    class="bg-gray-50 rounded-xl p-5 border border-gray-100/50 space-y-3 font-mono text-sm">
                                    <div class="flex sm:items-center flex-col sm:flex-row gap-1 sm:gap-4">
                                        <span class="text-gray-400 w-24 flex-shrink-0">ID</span>
                                        <span class="text-gray-700 font-semibold"
                                            x-text="selectedArticle.story_id"></span>
                                    </div>
                                    <template x-if="selectedArticle.source_url || selectedArticle.url">
                                        <div class="flex sm:items-center flex-col sm:flex-row gap-1 sm:gap-4">
                                            <span class="text-gray-400 w-24 flex-shrink-0">Source URL</span>
                                            <a :href="selectedArticle.source_url || selectedArticle.url" target="_blank"
                                                class="text-udn-blue hover:underline truncate"
                                                x-text="selectedArticle.source_url || selectedArticle.url"></a>
                                        </div>
                                    </template>
                                    <div class="flex sm:items-center flex-col sm:flex-row gap-1 sm:gap-4">
                                        <span class="text-gray-400 w-24 flex-shrink-0">Scraped At</span>
                                        <span class="text-gray-700"
                                            x-text="formatDate(selectedArticle.scraped_at)"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Notification Toast (For WebSockets) -->
    <div class="fixed bottom-6 right-6 z-50 transition-all duration-500 transform"
        :class="showToast ? 'translate-y-0 opacity-100' : 'translate-y-20 opacity-0 pointer-events-none'" x-cloak>
        <div
            class="bg-gray-900 rounded-2xl shadow-2xl p-5 pr-12 flex items-start max-w-sm relative border border-gray-800">
            <div class="flex-shrink-0 bg-udn-blue rounded-full p-2">
                <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
                    </path>
                </svg>
            </div>
            <div class="ml-4">
                <h3 class="text-sm font-bold text-white uppercase tracking-wider" x-text="toastTitle">新消息</h3>
                <div class="mt-1 text-sm text-gray-400">
                    <p x-text="toastMessage">剛抓取到最新焦點新聞。</p>
                </div>
            </div>
            <button @click="showToast = false"
                class="absolute top-5 right-5 text-gray-500 hover:text-white transition-colors">
                <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                        clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
