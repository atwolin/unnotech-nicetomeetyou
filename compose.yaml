services:
  db:
    image: postgres:16.13-alpine
    container_name: udnnews_db
    shm_size: 128mb
    env_file:
      - .env
    ports:
      - "5436:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - udnnews

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - backend_static:/app/staticfiles
    env_file:
      - .env
    networks:
      - udnnews
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - udnnews
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  udnnews:
    driver: bridge

volumes:
  db_data:
  backend_static:
